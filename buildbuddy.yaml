actions:
  - name: Build and test
    container_image: ubuntu-24.04
    triggers:
      pull_request:
        branches:
          - "*"
    # The pinned TheRock SDK is ~3 GB compressed and ~15 GB extracted.
    resource_requests:
      disk: "50GB"
    steps:
      - run: bazel build //...
      - run: bazel test //...
      - run: bazel run @rules_rs//tools/rust_analyzer:gen_rust_project
